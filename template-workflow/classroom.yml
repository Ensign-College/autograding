name: GitHub Classroom Workflow
run-name: "Autograding ${{ inputs.grading_run_id || github.sha }}"

on:
  push:
  workflow_dispatch:
    inputs:
      grading_run_id:
        description: ExpertFlow GradingRun id
        required: false
      sha:
        description: Commit SHA to grade
        required: false

permissions:
  checks: write
  actions: read
  contents: read

jobs:
  build:
    name: Autograding
    runs-on: ubuntu-latest
    if: github.actor != 'github-classroom[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha || github.sha }}
      # Decision 1: never trust the student's copies of tests OR test configuration.
      - name: Overlay canonical tests from template
        uses: actions/checkout@v4
        with:
          repository: Ensign-College/python-first-programs-starter
          path: __template__
      - name: Apply overlay
        run: |
          # Remove student-controlled test-config entry points that could subvert
          # the overlaid tests (pytest auto-loads root conftest.py; addopts/plugins
          # can be injected via pyproject/setup.cfg/tox).
          rm -f conftest.py pyproject.toml setup.cfg tox.ini pytest.ini
          rm -rf tests .github/classroom
          cp -R __template__/tests tests
          cp -R __template__/.github/classroom .github/classroom
          [ -f __template__/pytest.ini ] && cp __template__/pytest.ini pytest.ini
          [ -f __template__/requirements.txt ] && cp __template__/requirements.txt requirements.txt
          rm -rf __template__
      - uses: Ensign-College/autograding@v1
        with:
          grading-run-id: ${{ inputs.grading_run_id }}
          sha: ${{ inputs.sha || github.sha }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: autograding-results
          path: autograding-results.json
